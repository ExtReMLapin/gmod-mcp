name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win64
          - os: ubuntu-22.04
            platform: linux64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Asks CMake for its code model (File API, codemodel-v2) at configure time, on both generators: the fixture check
      # reads it to prove that nothing under tests/conformance/ is a source of any target but the conformance host.
      - name: Request the CMake code model
        shell: bash
        run: |
          mkdir -p build/.cmake/api/v1/query
          touch build/.cmake/api/v1/query/codemodel-v2

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # A bounded job count: unbounded make -j started every compile at once and the Linux runner killed them
        # (exit 143) once the test executables also compiled every source.
        run: cmake --build build --config Release --parallel 4

      # Every test step tees its output to build/logs/*.log: cmake/ci_badges.py reads them for the README badges.
      - name: Native unit tests (no game)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          for name in gmod-mcp-unittests gmod-mcp-coretests; do
            t=$(find build -name "$name" -type f -o -name "$name.exe" -type f | head -n 1)
            "$t" 2>&1 | tee "build/logs/${name#gmod-mcp-}.log"
          done

      - name: Lua runtime tests (no game, LuaJIT 2.1.0-beta3 like the game)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p build/logs
          sudo apt-get install -y luajit
          luajit -v
          luajit tests/lua/runtime_test.lua src/lua 2>&1 | tee build/logs/runtime.log

      - name: Bridge tests (no game - closed, fake server, 2026-07-28 client)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bridge=$(find build -name "gmod-mcp-bridge" -type f -o -name "gmod-mcp-bridge.exe" -type f | head -n 1)
          py=$(command -v python3 || command -v python)
          "$py" -u tests/bridge/test_bridge.py "$bridge" 2>&1 | tee build/logs/bridge.log

      - name: Protocol constants vs the official MCP schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          py=$(command -v python3 || command -v python)
          "$py" tests/protocol/check_constants.py 2>&1 | tee build/logs/protocol.log

      - name: Comparison table tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          py=$(command -v python3 || command -v python)
          "$py" -B -m unittest discover -s tests/comparison 2>&1 | tee build/logs/comparison.log

      - name: CI scripts tests (conformance runner, fixture check, badges)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          py=$(command -v python3 || command -v python)
          "$py" -B -m unittest discover -s tests/conformance 2>&1 | tee build/logs/conformance-unit.log
          "$py" -B -m unittest discover -s tests/ci 2>&1 | tee build/logs/ci-unit.log

      # The suite's fixtures (test_simple_text, slow_compute, greet...) exist only in tests/conformance and in the
      # conformance host. Guarantees, strongest first (see check_fixtures_absent.py): (1) the CMake build graph: no
      # source under tests/conformance/ belongs to a target other than the host (deterministic, any generator);
      # (2) no fixture name as a literal in src/, loader/, plugin/, and no set_request_hooks call there; (3) a scan of
      # the module and the bridge for the fixture names and for the host's canary string, which the host must itself
      # contain (a compiler may hide short names, so only the long canary is a reliable control). Names come from
      # tests/conformance itself, so a new fixture is covered without editing this step. It runs before the conformance
      # suite (it needs only the build), so that a failing suite never hides a leak.
      - name: Fixture tools absent from shipped binaries
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" tests/conformance/check_fixtures_absent.py --build-dir build

      # The official MCP conformance suite against the module's real MCP server code (no game): the host executable
      # tests/conformance builds with the other test programs serves the suite's fixtures; run.py compares the results
      # with tests/conformance/expected-failures.json and writes build/conformance-summary.json.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: MCP conformance suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          py=$(command -v python3 || command -v python)
          "$py" -u tests/conformance/run.py 2>&1 | tee build/logs/conformance.log

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="gmod-mcp-${{ matrix.platform }}"
          # Extract the zip into the game folder (the one that contains "garrysmod").
          mkdir -p "dist/$name/garrysmod/lua/bin" "dist/$name/garrysmod/lua/autorun/server"
          dll=$(find build -name "gmsv_mcpagent_${{ matrix.platform }}.dll" | head -n 1)
          cp "$dll" "dist/$name/garrysmod/lua/bin/"
          # Stamp the autorun with the CRC32 of this exact DLL (checked by the game before loading it).
          py=$(command -v python3 || command -v python)
          crc=$("$py" -c "import sys, zlib; print(zlib.crc32(open(sys.argv[1], 'rb').read()))" "$dll")
          sed "s/@MCPAGENT_DLL_CRC@/$crc/" loader/mcpagent_boot.lua > "dist/$name/garrysmod/lua/autorun/server/mcpagent_boot.lua"
          grep -q "\"$crc\"" "dist/$name/garrysmod/lua/autorun/server/mcpagent_boot.lua"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          # Pieces of the Claude Code plugin, assembled by the plugin job: the module tree and the bridge.
          mkdir -p "plugin-part/module/${{ matrix.platform }}" plugin-part/bin
          cp -r "dist/$name/garrysmod" "plugin-part/module/${{ matrix.platform }}/"
          bridge=$(find build -name "gmod-mcp-bridge" -type f -o -name "gmod-mcp-bridge.exe" -type f | head -n 1)
          cp "$bridge" plugin-part/bin/
          # The bridge also goes in the module zip, for MCP clients other than Claude Code (outside garrysmod/).
          cp "$bridge" "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$name.zip" "$name" > /dev/null; else zip -qr "$name.zip" "$name"; fi
          sha256sum "$name.zip" > "$name.zip.sha256"

      # Counts for the README badges (published by the badges job below, on pushes to main only).
      - name: Collect badge data
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p badge-data
          cp build/logs/*.log badge-data/ 2>/dev/null || true
          cp build/conformance-summary.json badge-data/ 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: badge-data-${{ matrix.platform }}
          path: badge-data/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: gmod-mcp-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: plugin-part-${{ matrix.platform }}
          path: plugin-part/

  # The Claude Code plugin: skill + MCP server declaration + bridge and module for both platforms, in one zip.
  plugin:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: plugin-part-*
          path: parts
          merge-multiple: true
      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(gmod_mcp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          mkdir -p dist/plugin
          cp -r plugin/. dist/plugin/
          cp -r parts/bin parts/module dist/plugin/
          chmod +x dist/plugin/bin/gmod-mcp-bridge
          cp LICENSE THIRD_PARTY_NOTICES.md dist/plugin/
          # The plugin's MCP server: the bridge, found without extension on Windows too. The plugin option
          # feedback_offers (userConfig) reaches it as an environment variable.
          printf '%s\n' '{ "mcpServers": { "gmod": { "command": "${CLAUDE_PLUGIN_ROOT}/bin/gmod-mcp-bridge", "env": { "GMOD_MCP_FEEDBACK_OFFERS": "${user_config.feedback_offers}" } } } }' > dist/plugin/.mcp.json
          # Same version as the module and the bridge.
          py=$(command -v python3)
          "$py" - "$version" <<'PY'
          import json, sys
          p = "dist/plugin/.claude-plugin/plugin.json"
          j = json.load(open(p)); j["version"] = sys.argv[1]
          open(p, "w").write(json.dumps(j, indent=2) + "\n")
          PY
          (cd dist/plugin && zip -qr ../gmod-mcp-plugin.zip .)
          (cd dist && sha256sum gmod-mcp-plugin.zip > gmod-mcp-plugin.zip.sha256)
      - uses: actions/upload-artifact@v6
        with:
          name: gmod-mcp-plugin
          path: |
            dist/gmod-mcp-plugin.zip
            dist/gmod-mcp-plugin.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # The release notes are the version's section of CHANGELOG.md (the release fails without one).
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          python3 cmake/release_notes.py "${GITHUB_REF_NAME}" "$prev" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          body_path: release-notes.md

  # Points the marketplace at the plugin zip of this release (Claude Code then offers the update).
  marketplace:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: gmod-mcp-plugin
          path: dist
      - name: Update marketplace.json
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha=$(cut -d' ' -f1 dist/gmod-mcp-plugin.zip.sha256)
          python3 - "$tag" "$sha" <<'PY'
          import json, sys
          tag, sha = sys.argv[1], sys.argv[2]
          p = ".claude-plugin/marketplace.json"
          j = json.load(open(p))
          for e in j["plugins"]:
              if e["name"] == "gmod-mcp":
                  e["source"] = {"source": "archive", "sha256": sha,
                                 "url": f"https://github.com/${{ github.repository }}/releases/download/{tag}/gmod-mcp-plugin.zip"}
                  e["version"] = tag.lstrip("v")
          open(p, "w").write(json.dumps(j, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git diff --cached --quiet || git commit -m "Marketplace: plugin ${tag}"
          git push origin HEAD:main

  # The README badges: tests.json and mcp-conformance.json (shields.io endpoint format) on the orphan branch `badges`.
  # Pushes to main only (not tags, not pull requests). It is a separate job, not a step of the Linux leg, so that it
  # sees both legs (a failure on Windows turns the badge red), runs even when the build failed (the badge then says so)
  # and holds the write permission alone. Publishing is best effort: this job can never fail the workflow.
  badges:
    # Not on a cancelled run: a cancelled build says nothing about the code, the badges keep the last real result.
    if: (success() || failure()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    continue-on-error: true
    concurrency:
      group: badges
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: badge-data-*
          path: badge-data
      - name: Generate badges
        shell: bash
        run: |
          set -euo pipefail
          # The Linux leg is the primary one (it runs every suite, the counts are its); Windows only adds failures.
          python3 cmake/ci_badges.py --dir badge-data/badge-data-linux64 --dir badge-data/badge-data-win64 \
            --out "$RUNNER_TEMP/badges" --build-result "${{ needs.build.result }}"
      - name: Publish to the badges branch
        # Best effort: a failure here is shown on this step only (the job and the workflow stay green).
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # A newer push to main will publish its own numbers: do not overwrite them with older ones.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main moved on ($head): skipping"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth=1 origin badges
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
            git rm -rf -q .
          fi
          cp "$RUNNER_TEMP"/badges/*.json .
          git add tests.json mcp-conformance.json
          git diff --cached --quiet || git commit -q -m "Badges: ${GITHUB_SHA::7}"
          git push origin HEAD:badges
