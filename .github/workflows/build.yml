name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win64
          - os: ubuntu-22.04
            platform: linux64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="gmod-mcp-${{ matrix.platform }}"
          # Extract the zip into the game folder (the one that contains "garrysmod").
          mkdir -p "dist/$name/garrysmod/lua/bin" "dist/$name/garrysmod/lua/autorun/server"
          dll=$(find build -name "gmsv_mcpagent_${{ matrix.platform }}.dll" | head -n 1)
          cp "$dll" "dist/$name/garrysmod/lua/bin/"
          # Stamp the autorun with the CRC32 of this exact DLL (checked by the game before loading it).
          py=$(command -v python3 || command -v python)
          crc=$("$py" -c "import sys, zlib; print(zlib.crc32(open(sys.argv[1], 'rb').read()))" "$dll")
          sed "s/@MCPAGENT_DLL_CRC@/$crc/" loader/mcpagent_boot.lua > "dist/$name/garrysmod/lua/autorun/server/mcpagent_boot.lua"
          grep -q "\"$crc\"" "dist/$name/garrysmod/lua/autorun/server/mcpagent_boot.lua"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$name.zip" "$name" > /dev/null; else zip -qr "$name.zip" "$name"; fi
          sha256sum "$name.zip" > "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gmod-mcp-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
